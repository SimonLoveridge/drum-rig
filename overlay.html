<!DOCTYPE html>
<html>
<head>
    <title>Drum Overlay - Right Aligned</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root { --accent: #00ffcc; }
        
        body { 
            margin: 0; 
            padding: 20px; 
            background: transparent; 
            overflow: hidden; 
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: flex-end; /* Aligns the box to the right of the screen */
        }

        #info-box {
            display: flex;
            flex-direction: column;
            align-items: flex-end; /* Aligns individual text lines to the right */
            text-align: right;
            pointer-events: none;
            text-transform: uppercase;
            max-width: 80%; /* Prevents text from hitting the far left edge */
        }

        .requested-by {
            color: var(--accent);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,1), 0 0 10px rgba(0,0,0,0.5);
            margin-bottom: 2px;
        }

        .song-title {
            color: #ffffff;
            font-size: 32px; /* Slightly larger for impact */
            font-weight: 900;
            text-shadow: 3px 3px 6px rgba(0,0,0,1), -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            line-height: 1.1;
        }
    </style>
</head>
<body>
    <div id="info-box">
        <span id="display-user" class="requested-by">SYSTEM STANDBY</span>
        <span id="display-title" class="song-title">READY FOR REQUESTS</span>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://drumrequests-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        database.ref('currentlyPlaying').on('value', snapshot => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('display-title').innerText = data.title;
                document.getElementById('display-user').innerText = `REQUESTED BY: ${data.user}`;
            }
        });
    </script>
</body>
</html>
