<!DOCTYPE html>
<html>
<head>
    <title>Drum Remote - Stage Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root { --accent: #00ffcc; --card-bg: #1a1a1a; --undo-color: #ffcc00; --twitch: #9146ff; --danger: #ff4444; }
        * { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        body { background: #0a0a0a; color: #eee; font-family: 'Segoe UI', system-ui, sans-serif; padding: 10px; margin: 0; }

        /* AUTH SCREEN */
        #lock-screen { position: fixed; top:0; left:0; width:100%; height:100%; background:#050505; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        .pin-display { font-size: 3.5rem; letter-spacing: 15px; color: var(--accent); margin-bottom: 30px; height: 60px; font-family: monospace; }
        .numpad { display: grid; grid-template-columns: repeat(3, 90px); gap: 20px; }
        .num-btn { width: 90px; height: 90px; border-radius: 50%; border: 2px solid #222; background: #111; color: white; font-size: 2.2rem; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .num-btn:active { background: var(--accent); color: black; transform: scale(0.95); }

        #main-content { display: none; max-width: 900px; margin: 0 auto; }

        /* DASHBOARD */
        .dashboard-card { background: var(--card-bg); border-radius: 16px; padding: 20px; margin-bottom: 15px; border: 1px solid #333; }
        .track-info { margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 10px; text-align: center; }
        .active-title { font-size: 1.8rem; font-weight: 900; color: #fff; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .active-user { color: #aaa; font-weight: bold; font-size: 1.1rem; margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .twitch-icon { color: var(--twitch); }
        .user-highlight { color: var(--accent); }

        .split-controls { display: flex; gap: 20px; align-items: stretch; margin-bottom: 20px; }
        .thumb-box { flex: 1.2; border-radius: 12px; overflow: hidden; border: 2px solid #333; background: #000; min-height: 180px; }
        #active-thumb { width: 100%; height: 100%; object-fit: cover; }

        .btn-stack { flex: 1; display: flex; flex-direction: column; gap: 12px; }
        .main-trigger { flex: 2; background: var(--accent); color: black; border: none; border-radius: 12px; font-size: 3.5rem; display: flex; align-items: center; justify-content: center; }
        .secondary-actions { flex: 1; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .btn-action { background: #333; color: white; border: none; border-radius: 10px; font-size: 1.6rem; display: flex; align-items: center; justify-content: center; }
        
        /* UNDO STATE */
        .btn-action.undo { color: #444; pointer-events: none; transition: all 0.3s ease; }
        .btn-action.undo.active { color: var(--undo-color); background: #332b00; border: 1px solid var(--undo-color); pointer-events: auto; }

        .progress-area { width: 100%; }
        .time-labels { display: flex; justify-content: space-between; font-family: monospace; color: #888; font-size: 1.1rem; margin-bottom: 8px; }
        #progress-bar { width: 100%; height: 35px; accent-color: var(--accent); cursor: pointer; }

        /* QUEUE */
        .queue-item { background: #181818; padding: 15px; margin: 8px 0; border-radius: 10px; display: flex; align-items: center; gap: 15px; border: 1px solid #282828; }
        .drag-handle { color: #444; font-size: 1.8rem; cursor: grab; }
        .song-details { flex-grow: 1; overflow: hidden; }
        .song-title { font-weight: bold; font-size: 1.25rem; color: #fff; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-user { font-size: 0.95rem; color: #888; }
        .play-now { background: #222; color: var(--accent); border: 1px solid var(--accent); padding: 12px 20px; border-radius: 8px; font-weight: bold; }
        .trash { color: var(--danger); font-size: 1.6rem; border: none; background: none; }

        .footer-tools { margin-top: 30px; display: flex; flex-direction: column; gap: 10px; }
        .btn-debug { background: #1a1a1a; color: #555; border: 1px dashed #333; padding: 12px; border-radius: 8px; font-size: 0.9rem; text-transform: uppercase; }
        .btn-danger-wide { width: 100%; padding: 25px; background: #201010; color: var(--danger); border: 1px solid var(--danger); border-radius: 12px; font-weight: bold; text-transform: uppercase; font-size: 1.2rem; }
        .btn-danger-wide.confirm { background: var(--danger); color: black; }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div id="pin-dots" class="pin-display"></div>
        <div class="numpad">
            <div class="num-btn" onclick="pressNum('1')">1</div><div class="num-btn" onclick="pressNum('2')">2</div><div class="num-btn" onclick="pressNum('3')">3</div>
            <div class="num-btn" onclick="pressNum('4')">4</div><div class="num-btn" onclick="pressNum('5')">5</div><div class="num-btn" onclick="pressNum('6')">6</div>
            <div class="num-btn" onclick="pressNum('7')">7</div><div class="num-btn" onclick="pressNum('8')">8</div><div class="num-btn" onclick="pressNum('9')">9</div>
            <div class="num-btn" onclick="pressNum('C')" style="color:var(--danger)">C</div><div class="num-btn" onclick="pressNum('0')">0</div><div class="num-btn" onclick="pressNum('D')"><i class="fas fa-backspace"></i></div>
        </div>
    </div>

    <div id="main-content">
        <div class="dashboard-card">
            <div class="track-info">
                <div id="active-title" class="active-title">Waiting for Track...</div>
                <div id="active-user" class="active-user"><i class="fab fa-twitch twitch-icon"></i> Ready for Session</div>
            </div>
            <div class="split-controls">
                <div class="thumb-box"><img id="active-thumb" src=""></div>
                <div class="btn-stack">
                    <button class="main-trigger" onclick="togglePlayback()"><i id="toggle-icon" class="fas fa-play"></i></button>
                    <div class="secondary-actions">
                        <button class="btn-action" onclick="sendControl('mute')"><i class="fas fa-volume-mute"></i></button>
                        <button id="undo-btn" class="btn-action undo" onclick="handleUndo()"><i class="fas fa-undo"></i></button>
                        <button class="btn-action skip" onclick="skipToNext()"><i class="fas fa-forward"></i></button>
                    </div>
                </div>
            </div>
            <div class="progress-area">
                <div class="time-labels"><span id="time-current">0:00</span><span id="time-total">0:00</span></div>
                <input type="range" id="progress-bar" min="0" max="100" value="0" onchange="seekVideo(this.value)">
            </div>
        </div>

        <div id="queue-list"></div>
        
        <div class="footer-tools">
            <button class="btn-debug" onclick="populateQueue()">Load Train of Thought Songs</button>
            <button id="clear-btn" class="btn-danger-wide" onclick="clearQueue()">Clear Everything</button>
        </div>
    </div>

    <script>
        const SECRET_CODE = "123456"; 
        let currentInput = "";
        const firebaseConfig = { databaseURL: "https://drumrequests-default-rtdb.europe-west1.firebasedatabase.app/" };
        let database, lastAction = null;

        function pressNum(n) {
            if (n === 'C') currentInput = "";
            else if (n === 'D') currentInput = currentInput.slice(0, -1);
            else if (currentInput.length < 6) currentInput += n;
            document.getElementById('pin-dots').innerText = "•".repeat(currentInput.length);
            if (currentInput === SECRET_CODE) { localStorage.setItem('rig_access', 'true'); unlock(); }
        }

        function unlock() {
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            initApp();
        }

        if (localStorage.getItem('rig_access') === 'true') unlock();

        function initApp() {
            firebase.initializeApp(firebaseConfig);
            database = firebase.database();
            let currentPlayerState = "paused", currentTotalTime = 0;

            Sortable.create(document.getElementById('queue-list'), {
                animation: 150, handle: '.drag-handle', onEnd: function() {
                    document.querySelectorAll('.queue-item').forEach((item, index) => {
                        database.ref('queue').child(item.getAttribute('data-key')).update({ sortOrder: index });
                    });
                }
            });

            database.ref('playerStatus').on('value', snap => {
                currentPlayerState = snap.val() || "paused";
                document.getElementById('toggle-icon').className = (currentPlayerState === "playing") ? "fas fa-pause" : "fas fa-play";
            });

            database.ref('playbackTime').on('value', snap => {
                const data = snap.val(); if (!data) return;
                currentTotalTime = data.total;
                if (!document.getElementById('progress-bar').matches(':active')) {
                    document.getElementById('progress-bar').value = (data.current / data.total) * 100;
                }
                document.getElementById('time-current').innerText = formatTime(data.current);
                document.getElementById('time-total').innerText = formatTime(data.total);
            });

            database.ref('currentlyPlaying').on('value', snap => {
                const data = snap.val();
                if(data) {
                    document.getElementById('active-title').innerText = data.title;
                    document.getElementById('active-user').innerHTML = `<i class="fab fa-twitch twitch-icon"></i> Request from: <span class="user-highlight">${data.user}</span>`;
                    document.getElementById('active-thumb').src = `https://i.ytimg.com/vi/${data.id}/mqdefault.jpg`;
                }
            });

            database.ref('queue').orderByChild('sortOrder').on('value', snap => {
                const list = document.getElementById('queue-list'); list.innerHTML = "";
                snap.forEach(child => {
                    const item = child.val();
                    const div = document.createElement('div');
                    div.className = 'queue-item'; div.setAttribute('data-key', child.key);
                    div.innerHTML = `<div class="drag-handle"><i class="fas fa-grip-vertical"></i></div><div class="song-details"><span class="song-title">${item.title}</span><span class="song-user">by ${item.user}</span></div><button class="play-now" onclick="loadTrack('${child.key}', ${JSON.stringify(item).replace(/"/g, '&quot;')})">LOAD</button><button class="trash" onclick="deleteTrack('${child.key}')"><i class="fas fa-trash"></i></button>`;
                    list.appendChild(div);
                });
            });

            window.formatTime = s => Math.floor(s/60) + ":" + Math.floor(s%60).toString().padStart(2,'0');
            window.sendControl = (a, v = null) => database.ref('controls').push({ action: a, value: v, ts: Date.now() });
            window.togglePlayback = () => sendControl(currentPlayerState === "playing" ? "pause" : "play");
            window.seekVideo = p => sendControl('seek', (p / 100) * currentTotalTime);
            window.deleteTrack = k => database.ref('queue').child(k).remove();
            window.loadTrack = (k, item) => { database.ref('currentlyPlaying').set({ ...item, ts: Date.now() }); database.ref('queue').child(k).remove(); };
            window.skipToNext = () => { database.ref('queue').orderByChild('sortOrder').limitToFirst(1).once('value', s => s.forEach(c => loadTrack(c.key, c.val()))); };
            
            window.clearQueue = function() {
                const btn = document.getElementById('clear-btn');
                if (btn.classList.contains('confirm')) {
                    database.ref('queue').once('value', snap => {
                        const data = snap.val();
                        if (data) {
                            lastAction = { type: 'clear', fullData: data };
                            document.getElementById('undo-btn').classList.add('active');
                        }
                        database.ref('queue').remove();
                        btn.classList.remove('confirm'); btn.innerText = "Clear Everything";
                    });
                } else {
                    btn.classList.add('confirm'); btn.innerText = "ARE YOU SURE?";
                    setTimeout(() => { btn.classList.remove('confirm'); btn.innerText = "Clear Everything"; }, 3000);
                }
            };

            window.handleUndo = () => { 
                if(lastAction?.type === 'clear' && lastAction.fullData) {
                    database.ref('queue').set(lastAction.fullData); 
                }
                lastAction = null; 
                document.getElementById('undo-btn').classList.remove('active'); 
            };

            window.populateQueue = function() {
                const songs = [
                    {id:'_Q9Ss5zZU4k',title:'As I Am', user: 'System', sortOrder: 0},
                    {id:'PqKZFSZ_6yU',title:'This Dying Soul', user: 'System', sortOrder: 1},
                    {id:'P9Lnan8t0v8',title:'Endless Sacrifice', user: 'System', sortOrder: 2},
                    {id:'rS4v6p_kI6E',title:'Honor Thy Father', user: 'System', sortOrder: 3},
                    {id:'_f_vV6vW6mI',title:'Vacant', user: 'System', sortOrder: 4},
                    {id:'qV8v8L8P8-Y',title:'Stream of Consciousness', user: 'System', sortOrder: 5},
                    {id:'2u788fU070Q',title:'In the Name of God', user: 'System', sortOrder: 6}
                ];
                songs.forEach(s => database.ref('queue').push(s));
            };
        }
    </script>
</body>
</html>
