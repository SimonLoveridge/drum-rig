<!DOCTYPE html>
<html>
<head>
    <title>Drum Remote - Stage Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root { --accent: #00ffcc; --card-bg: #1a1a1a; --undo-color: #ffcc00; --twitch: #9146ff; --danger: #ff4444; }
        body { background: #0a0a0a; color: #eee; font-family: 'Segoe UI', system-ui, sans-serif; padding: 10px; margin: 0; }

        /* AUTH SCREEN (Existing Logic) */
        #lock-screen { position: fixed; top:0; left:0; width:100%; height:100%; background:#050505; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        .pin-display { font-size: 3rem; letter-spacing: 15px; color: var(--accent); margin-bottom: 30px; height: 60px; }
        .numpad { display: grid; grid-template-columns: repeat(3, 85px); gap: 15px; }
        .num-btn { width: 85px; height: 85px; border-radius: 50%; border: 2px solid #222; background: #111; color: white; font-size: 2rem; display: flex; align-items: center; justify-content: center; }
        .num-btn:active { background: var(--accent); color: black; }

        #main-content { display: none; max-width: 900px; margin: 0 auto; }

        /* --- THE NEW DASHBOARD LAYOUT --- */
        .dashboard-card { background: var(--card-bg); border-radius: 16px; padding: 20px; margin-bottom: 15px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .track-info { margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .active-title { font-size: 1.8rem; font-weight: 900; color: #fff; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .active-user { color: var(--accent); font-weight: bold; font-size: 1.1rem; margin-top: 4px; }

        .split-controls { display: flex; gap: 20px; align-items: stretch; margin-bottom: 20px; }
        
        /* Left: Thumbnail */
        .thumb-box { flex: 1.2; position: relative; border-radius: 12px; overflow: hidden; border: 2px solid #333; background: #000; display: flex; align-items: center; justify-content: center; }
        #active-thumb { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.3s; }

        /* Right: High-Impact Buttons */
        .btn-stack { flex: 1; display: flex; flex-direction: column; gap: 12px; }
        
        .main-trigger { flex: 2; background: var(--accent); color: black; border: none; border-radius: 12px; font-size: 3rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #008a6e; }
        .main-trigger:active { transform: translateY(2px); box-shadow: none; }
        
        .secondary-actions { flex: 1; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .btn-action { background: #333; color: white; border: none; border-radius: 10px; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; }
        .btn-action.skip { background: #444; font-size: 1.8rem; flex-grow: 2; }
        .btn-action.undo.active { background: #443300; color: var(--undo-color); border: 1px solid var(--undo-color); }
        .btn-action:active { background: #555; }

        /* Progress Area */
        .progress-area { width: 100%; margin-top: 10px; }
        .time-labels { display: flex; justify-content: space-between; font-family: monospace; color: #888; font-size: 1.1rem; margin-bottom: 5px; }
        #progress-bar { width: 100%; height: 25px; accent-color: var(--accent); cursor: pointer; }

        /* Queue List */
        .queue-item { background: #181818; padding: 12px 15px; margin: 8px 0; border-radius: 10px; display: flex; align-items: center; gap: 15px; border: 1px solid #282828; }
        .drag-handle { color: #444; font-size: 1.5rem; padding: 5px; cursor: grab; }
        .song-details { flex-grow: 1; overflow: hidden; }
        .song-title { font-weight: bold; font-size: 1.2rem; color: #fff; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-user { font-size: 0.9rem; color: #888; }
        .play-now { background: #333; color: var(--accent); border: 1px solid var(--accent); padding: 10px 15px; border-radius: 8px; font-weight: bold; }
        .trash { color: var(--danger); font-size: 1.5rem; border: none; background: none; padding: 5px 10px; }

        .clear-zone { margin-top: 30px; }
        .btn-danger-wide { width: 100%; padding: 20px; background: #201010; color: var(--danger); border: 1px solid var(--danger); border-radius: 12px; font-weight: bold; text-transform: uppercase; font-size: 1.1rem; }
        .btn-danger-wide.confirm { background: var(--danger); color: black; }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div id="pin-dots" class="pin-display"></div>
        <div class="numpad">
            <div class="num-btn" onclick="pressNum('1')">1</div><div class="num-btn" onclick="pressNum('2')">2</div><div class="num-btn" onclick="pressNum('3')">3</div>
            <div class="num-btn" onclick="pressNum('4')">4</div><div class="num-btn" onclick="pressNum('5')">5</div><div class="num-btn" onclick="pressNum('6')">6</div>
            <div class="num-btn" onclick="pressNum('7')">7</div><div class="num-btn" onclick="pressNum('8')">8</div><div class="num-btn" onclick="pressNum('9')">9</div>
            <div class="num-btn" onclick="pressNum('C')" style="color:var(--danger)">C</div><div class="num-btn" onclick="pressNum('0')">0</div><div class="num-btn" onclick="pressNum('D')"><i class="fas fa-backspace"></i></div>
        </div>
    </div>

    <div id="main-content">
        <div class="dashboard-card">
            <div class="track-info">
                <div id="active-title" class="active-title">No Track Loaded</div>
                <div id="active-user" class="active-user">Ready for Session</div>
            </div>

            <div class="split-controls">
                <div class="thumb-box">
                    <img id="active-thumb" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
                </div>
                
                <div class="btn-stack">
                    <button class="main-trigger" onclick="togglePlayback()">
                        <i id="toggle-icon" class="fas fa-play"></i>
                    </button>
                    <div class="secondary-actions">
                        <button class="btn-action" onclick="sendControl('mute')"><i class="fas fa-volume-mute"></i></button>
                        <button id="undo-btn" class="btn-action undo" onclick="handleUndo()"><i class="fas fa-undo"></i></button>
                        <button class="btn-action skip" onclick="skipToNext()"><i class="fas fa-forward"></i></button>
                    </div>
                </div>
            </div>

            <div class="progress-area">
                <div class="time-labels">
                    <span id="time-current">0:00</span>
                    <span id="time-total">0:00</span>
                </div>
                <input type="range" id="progress-bar" min="0" max="100" value="0" onchange="seekVideo(this.value)">
            </div>
        </div>

        <div id="queue-list"></div>
        
        <div class="clear-zone">
            <button id="clear-btn" class="btn-danger-wide" onclick="clearQueue()">Clear Everything</button>
        </div>
    </div>

    <script>
        const SECRET_CODE = "123456"; 
        let currentInput = "";
        const firebaseConfig = { databaseURL: "https://drumrequests-default-rtdb.europe-west1.firebasedatabase.app/" };
        
        function pressNum(n) {
            if (n === 'C') currentInput = "";
            else if (n === 'D') currentInput = currentInput.slice(0, -1);
            else if (currentInput.length < 6) currentInput += n;
            document.getElementById('pin-dots').innerText = "•".repeat(currentInput.length);
            if (currentInput === SECRET_CODE) { localStorage.setItem('rig_access', 'true'); unlock(); }
        }

        function unlock() {
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            initApp();
        }

        if (localStorage.getItem('rig_access') === 'true') unlock();

        function initApp() {
            firebase.initializeApp(firebaseConfig);
            const db = firebase.database();
            let currentPlayerState = "paused", currentTotalTime = 0, lastAction = null;

            Sortable.create(document.getElementById('queue-list'), {
                animation: 150, handle: '.drag-handle', onEnd: function() {
                    document.querySelectorAll('.queue-item').forEach((item, index) => {
                        db.ref('queue').child(item.getAttribute('data-key')).update({ sortOrder: index });
                    });
                }
            });

            db.ref('playerStatus').on('value', snap => {
                currentPlayerState = snap.val() || "paused";
                document.getElementById('toggle-icon').className = (currentPlayerState === "playing") ? "fas fa-pause" : "fas fa-play";
            });

            db.ref('playbackTime').on('value', snap => {
                const data = snap.val(); if (!data) return;
                currentTotalTime = data.total;
                if (!document.getElementById('progress-bar').matches(':active')) {
                    document.getElementById('progress-bar').value = (data.current / data.total) * 100;
                }
                document.getElementById('time-current').innerText = formatTime(data.current);
                document.getElementById('time-total').innerText = formatTime(data.total);
            });

            db.ref('currentlyPlaying').on('value', snap => {
                const data = snap.val();
                if(data) {
                    document.getElementById('active-title').innerText = data.title;
                    document.getElementById('active-user').innerText = `Request from: ${data.user}`;
                    document.getElementById
