<!DOCTYPE html>
<html>
<head>
    <title>Drum Request - OBS Overlay</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        /* OBS OVERLAY STYLING */
        body {
            margin: 0;
            padding: 20px;
            overflow: hidden;
            background-color: transparent; /* Essential for OBS */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8); /* Makes text readable over any background */
        }

        #overlay-container {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 25px;
            border-radius: 15px;
            border-left: 5px solid #00ffcc;
            width: fit-content;
            max-width: 600px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        #album-art {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .song-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        #song-title {
            font-size: 1.5rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 400px;
        }

        #requester {
            font-size: 1rem;
            color: #00ffcc;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .twitch-icon {
            color: #9146ff;
        }

        /* HIDDEN PLAYER (Keeps Audio) */
        #player-wrapper {
            position: absolute;
            top: -9999px; /* Moves video off-screen but keeps it active */
            left: -9999px;
        }

        /* VISUAL PROGRESS BAR */
        #progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.2);
            margin-top: 8px;
            border-radius: 2px;
        }

        #progress-fill {
            height: 100%;
            background: #00ffcc;
            width: 0%;
            transition: width 0.5s linear;
        }
    </style>
</head>
<body>

    <div id="overlay-container">
        <img id="album-art" src="" alt="">
        <div class="song-info">
            <div id="song-title">Waiting for Request...</div>
            <div id="requester">
                <i class="fab fa-twitch twitch-icon"></i> 
                <span id="user-name">Standby</span>
            </div>
            <div id="progress-container">
                <div id="progress-fill"></div>
            </div>
        </div>
    </div>

    <div id="player-wrapper">
        <div id="player"></div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://drumrequests-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let player;
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.getElementsByTagName('head')[0].appendChild(tag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '360',
                width: '640',
                playerVars: { 'autoplay': 1, 'controls': 0, 'disablekb': 1 },
                events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerReady(event) {
            // Listen for Song Changes
            database.ref('currentlyPlaying').on('value', snap => {
                const data = snap.val();
                if (data) {
                    player.loadVideoById(data.id);
                    document.getElementById('song-title').innerText = data.title;
                    document.getElementById('user-name').innerText = data.user;
                    document.getElementById('album-art').src = `https://i.ytimg.com/vi/${data.id}/mqdefault.jpg`;
                    
                    // Restart Animation
                    const container = document.getElementById('overlay-container');
                    container.style.animation = 'none';
                    container.offsetHeight; 
                    container.style.animation = null;
                }
            });

            // Listen for Remote Controls
            database.ref('controls').limitToLast(1).on('child_added', snap => {
                const cmd = snap.val();
                if (!cmd || Date.now() - cmd.ts > 5000) return;

                if (cmd.action === 'play') player.playVideo();
                if (cmd.action === 'pause') player.pauseVideo();
                if (cmd.action === 'seek') player.seekTo(cmd.value);
                if (cmd.action === 'mute') player.isMuted() ? player.unMute() : player.mute();
            });

            // Sync Time Back to Firebase (for the Remote progress bar)
            setInterval(() => {
                if (player && player.getCurrentTime) {
                    const current = player.getCurrentTime();
                    const total = player.getDuration();
                    database.ref('playbackTime').set({ current, total });
                    
                    // Update Overlay Progress Bar
                    const percent = (current / total) * 100;
                    document.getElementById('progress-fill').style.width = percent + "%";
                }
            }, 1000);
        }

        function onPlayerStateChange(event) {
            let state = "paused";
            if (event.data == YT.PlayerState.PLAYING) state = "playing";
            database.ref('playerStatus').set(state);
        }
    </script>
</body>
</html>
