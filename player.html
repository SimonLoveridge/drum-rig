<!DOCTYPE html>
<html>
<head>
    <title>Drum Stream Overlay</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root { --accent: #00ffcc; }
        
        body { 
            margin: 0; 
            padding: 0; 
            background: transparent; 
            overflow: hidden; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* VIDEO CONTAINER */
        #video-container {
            position: relative;
            width: 640px; /* Standard OBS window size, adjust as needed */
            height: 360px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #player { width: 100%; height: 100%; }

        /* TEXT OVERLAY - NO BACKGROUND */
        #text-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            pointer-events: none;
        }

        .song-title {
            color: #ffffff;
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0;
            /* High-contrast shadow for visibility on any background */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8), -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }

        .requested-by {
            color: var(--accent);
            font-size: 16px;
            font-weight: 700;
            margin-top: 2px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
        }

        /* INTEGRATED PROGRESS BAR */
        #progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px; /* Thin and subtle */
            background: rgba(255,255,255,0.1);
            z-index: 11;
        }

        #progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            transition: width 0.5s linear;
        }
    </style>
</head>
<body>

    <div id="video-container">
        <div id="text-overlay">
            <div id="display-title" class="song-title">STARTING SOON</div>
            <div id="display-user" class="requested-by">WAITING FOR REQUESTS</div>
        </div>
        
        <div id="player"></div>

        <div id="progress-container">
            <div id="progress-fill"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://drumrequests-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let player;
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '360',
                width: '640',
                videoId: '',
                playerVars: { 
                    'autoplay': 0, 
                    'controls': 0, 
                    'modestbranding': 1, 
                    'rel': 0, 
                    'disablekb': 1 
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            // Listen for Song Changes
            database.ref('currentlyPlaying').on('value', snapshot => {
                const data = snapshot.val();
                if (data) {
                    document.getElementById('display-title').innerText = data.title;
                    document.getElementById('display-user').innerText = `REQUESTED BY: ${data.user}`;
                    player.loadVideoById(data.id);
                }
            });

            // Listen for Controls
            database.ref('controls').on('child_added', snapshot => {
                const data = snapshot.val();
                if (!data || !player) return;

                switch(data.action) {
                    case 'play': player.playVideo(); break;
                    case 'pause': player.pauseVideo(); break;
                    case 'seek': player.seekTo(data.value); break;
                    case 'mute':
                        if (player.isMuted()) player.unMute();
                        else player.mute();
                        break;
                }
                snapshot.ref.remove();
            });

            // Heartbeat: Send time and status back to Remote
            setInterval(() => {
                if (player && player.getCurrentTime) {
                    database.ref('playbackTime').set({
                        current: player.getCurrentTime(),
                        total: player.getDuration()
                    });
                    
                    // Update the visual progress bar
                    const percent = (player.getCurrentTime() / player.getDuration()) * 100;
                    document.getElementById('progress-fill').style.width = percent + "%";
                }
            }, 1000);
        }

        function onPlayerStateChange(event) {
            let state = "paused";
            if (event.data == YT.PlayerState.PLAYING) state = "playing";
            database.ref('playerStatus').set(state);
        }
    </script>
</body>
</html>
