<!DOCTYPE html>
<html>
<head>
    <title>Drum Player - Thin Frame</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root { --accent: #00ffcc; }
        
        body { 
            margin: 0; 
            padding: 10px; /* Reduced padding for tighter cropping */
            background: #000; 
            overflow: hidden; 
        }

        #video-container {
            width: 640px; 
            height: 360px;
            background: #000;
            position: relative;
            /* Thinner 2.5px Solid White Border */
            border: 2.5px solid #ffffff;
            box-sizing: content-box; 
            border-radius: 0;
            /* Subtle glow to make the thin line pop */
            box-shadow: 0 0 5px rgba(255,255,255,0.2);
        }

        #player { width: 100%; height: 100%; display: block; }

        #progress-container {
            position: absolute; 
            bottom: 0; 
            left: 0;
            width: 100%; 
            height: 4px;
            background: rgba(0,0,0,0.6);
            z-index: 10;
        }

        #progress-fill {
            height: 100%; 
            width: 0%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            transition: width 0.5s linear;
        }
    </style>
</head>
<body>

    <div id="video-container">
        <div id="player"></div>
        <div id="progress-container">
            <div id="progress-fill"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://drumrequests-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        let player;

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '360',
                width: '640',
                videoId: '',
                playerVars: { 
                    'autoplay': 1, 
                    'controls': 0, 
                    'modestbranding': 1, 
                    'rel': 0, 
                    'disablekb': 1,
                    'iv_load_policy': 3 
                },
                events: {
                    'onReady': (e) => {
                        database.ref('currentlyPlaying').on('value', s => {
                            const val = s.val();
                            if(val) { 
                                player.loadVideoById(val.id); 
                                player.playVideo(); 
                            }
                        });

                        database.ref('controls').on('child_added', s => {
                            const d = s.val(); if(!d) return;
                            if(d.action==='play') player.playVideo();
                            if(d.action==='pause') player.pauseVideo();
                            if(d.action==='seek') player.seekTo(d.value);
                            if(d.action==='mute') player.isMuted() ? player.unMute() : player.mute();
                            s.ref.remove();
                        });

                        setInterval(() => {
                            if(player && player.getCurrentTime && player.getDuration) {
                                const cur = player.getCurrentTime();
                                const dur = player.getDuration();
                                database.ref('playbackTime').set({ current: cur, total: dur });
                                document.getElementById('progress-fill').style.width = ((cur/dur)*100) + "%";
                            }
                        }, 1000);
                    },
                    'onStateChange': (e) => { 
                        database.ref('playerStatus').set(e.data == 1 ? "playing" : "paused"); 
                    }
                }
            });
        }
    </script>
</body>
</html>
